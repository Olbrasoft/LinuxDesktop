name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed
    branches: [main]

env:
  VERSION_PREFIX: "1.0"

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Calculate version
      id: version
      run: |
        VERSION="${{ env.VERSION_PREFIX }}.${{ github.event.workflow_run.run_number }}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Deploying version: $VERSION"

    - name: Deploy gRPC Service
      env:
        DOTNET_ROOT: /home/jirka/.dotnet
        PATH: /home/jirka/.dotnet:/home/jirka/.dotnet/tools:/usr/local/bin:/usr/bin:/bin
      run: |
        echo "🚀 Deploying Desktop Monitor gRPC service version ${{ steps.version.outputs.version }}..."
        cd /home/jirka/Olbrasoft/LinuxDesktop
        git pull origin main
        sudo -E env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" dotnet publish src/LinuxDesktop.Monitor.GrpcService/LinuxDesktop.Monitor.GrpcService.csproj \
          -c Release \
          -o /opt/olbrasoft/desktop-monitor-grpc/app \
          -p:Version=${{ steps.version.outputs.version }} \
          --no-self-contained
        echo "✅ gRPC service deployed"

    - name: Deploy Web Dashboard
      env:
        DOTNET_ROOT: /home/jirka/.dotnet
        PATH: /home/jirka/.dotnet:/home/jirka/.dotnet/tools:/usr/local/bin:/usr/bin:/bin
      run: |
        echo "🚀 Deploying Desktop Monitor Web dashboard version ${{ steps.version.outputs.version }}..."
        cd /home/jirka/Olbrasoft/LinuxDesktop
        sudo -E env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" dotnet publish src/LinuxDesktop.Monitor.Web/LinuxDesktop.Monitor.Web.csproj \
          -c Release \
          -o /opt/olbrasoft/desktop-monitor-web/app \
          -p:Version=${{ steps.version.outputs.version }} \
          --no-self-contained
        echo "✅ Web dashboard deployed"

    - name: Restart Services
      run: |
        echo "🔄 Restarting Desktop Monitor services..."
        systemctl --user restart desktop-monitor-grpc.service
        systemctl --user restart desktop-monitor-web.service
        echo "✅ Services restarted"

    - name: Verify Services
      run: |
        echo "📊 Verifying services are running..."
        sleep 2
        if systemctl --user is-active --quiet desktop-monitor-grpc.service; then
          echo "✅ gRPC service is running (port 5054)"
        else
          echo "❌ gRPC service failed to start"
          exit 1
        fi
        if systemctl --user is-active --quiet desktop-monitor-web.service; then
          echo "✅ Web dashboard is running (port 5051)"
        else
          echo "❌ Web dashboard failed to start"
          exit 1
        fi
        echo "✅ Deployment completed: version ${{ steps.version.outputs.version }}"
